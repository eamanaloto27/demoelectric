services:
  - type: web
    name: demoelectric
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: APP_BASE_URL
        fromService:
          type: web
          name: demoelectric
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: demoelectric-db
          property: connectionString

databases:
  - name: demoelectric-db
    plan: free
    postgresMajorVersion: "17"
